[project]
name = "brasil-mcp-essentials"
version = "0.1.1"
description = "MCP server brasileiro, privacy-first, CNPJ alfanumérico-ready. 14 utilities offline para devs BR."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brasil MCP" }]
requires-python = ">=3.11"
keywords = ["mcp", "brasil", "cpf", "cnpj", "boleto", "pix", "validator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
    "mcp>=1.0.0",
    "typer>=0.12.0",
    "segno>=1.6.0",
    "holidays>=0.50",
]

[project.optional-dependencies]
telemetry = ["posthog>=3.5"]

[project.urls]
Homepage = "https://github.com/brasil-mcp/essentials"
Repository = "https://github.com/brasil-mcp/essentials"
Issues = "https://github.com/brasil-mcp/essentials/issues"

[project.scripts]
brasil-mcp = "brasil_mcp.adapters.cli.app:app"
brasil-mcp-server = "brasil_mcp.adapters.mcp.server:main"
brasil-mcp-essentials = "brasil_mcp.adapters.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brasil_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/brasil_mcp/core/boleto/febraban_codes.json" = "brasil_mcp/core/boleto/febraban_codes.json"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "hypothesis>=6.100",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/brasil_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
